# /config/TV/collections/gate.yml
# Stargate all the movies and shows (Provided you put the movies in Specials or Season 00)
# Author: cmattogno
# Method: plex_search (no Trakt, no external API dependency)
# Last Updated: 2026

collections:
  "Stargate Command - The Episodes":
    builder_level: episode
    collection_order: release
    sort_title: "!050_SGC"
    sync_mode: sync
    plex_search:
      type: episode
      any:
        title:
          - "Stargate SG-1"
          - "Stargate Atlantis"
          - "Stargate Universe"
          - "Stargate Origins"
