# TV/collections/lonegunmen.yml
# Second Spin off from The X Files, not part of the Mytharc, mad the collection to fit in with the Mytharc++
# Author: cmattogno
# Method: plex_search (no Trakt, no external API dependency)
# Last Updated: 2026

collections:
  "The Lone Gunmen":
    builder_level: episode
    collection_order: release
    plex_search:
      type: episode
      all:
        title: "The Lone Gunmen"
        any:
          episode_title:
          - Pilot
          - "Bond, Jimmy Bond"
          - Eine Kleine Frohike
          - Like Water for Octane
          - Three Men and a Smoking Diaper
          - "Madam, I'm Adam"
          - Planet of the Frohikes
          - Maximum Byers
          - "Diagnosis: Jimmy"
          - Tango de los Pistoleros
          - The Lying Game
          - All About Yves
          - "The Cap'n Toby Show"
    sort_title: "!050_!X-Files x Lone Gunmen"
    summary: "The Lone Gunmen, Richard 'Ringo' Langly, Melvin Frohike and John Fitzgerald Byers, are recurring characters in The X-Files Universe."
    sync_mode: sync
